<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>명청 왕조 경영 랭킹전</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#4792c9}
  body{
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Nanum Gothic",sans-serif;
    color:#3e2723;min-height:100vh;display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #wrap{width:100%;max-width:440px;padding:0 12px 28px}
  svg.px{shape-rendering:crispEdges;display:block}

  /* ===== HERO ===== */
  .hero{position:relative;margin:0 -12px;border-bottom:4px solid #4e342e;overflow:hidden}
  .hero svg{width:100%;height:auto}
  .title-zone{position:relative;margin-top:-62px;text-align:center;z-index:2;padding:0 6px}
  .title3d{
    position:relative;display:inline-block;
    font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15;
    background:linear-gradient(180deg,#ff5a4e 0%,#e53935 42%,#2f6fd6 58%,#1e4fa8 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .title3d::before{
    content:attr(data-text);position:absolute;left:0;top:0;z-index:-1;width:100%;
    color:#fff;-webkit-text-stroke:9px #3b1f14;
    text-shadow:0 3px 0 #3b1f14,0 6px 0 #3b1f14,0 8px 6px rgba(0,0,0,.35);
  }
  .title3d::after{
    content:attr(data-text);position:absolute;left:0;top:0;z-index:-1;width:100%;
    color:transparent;-webkit-text-stroke:3px #fff7d6;
  }
  .scroll{
    position:relative;display:inline-block;margin-top:12px;padding:7px 26px;
    background:#fbeec1;border:3px solid #4e342e;border-radius:6px;
    font-size:13px;font-weight:800;color:#5d4037;box-shadow:0 3px 0 #4e342e;
  }
  .scroll::before,.scroll::after{
    content:"";position:absolute;top:-6px;bottom:-6px;width:12px;
    background:#c8893b;border:3px solid #4e342e;border-radius:6px;
  }
  .scroll::before{left:-10px}.scroll::after{right:-10px}

  /* ===== CARD ===== */
  .card{
    background:#fffaf0;border:4px solid #4e342e;border-radius:22px;
    box-shadow:0 6px 0 #2e1c16,0 12px 24px rgba(0,0,0,.25);
    padding:18px 16px;margin-top:18px;
  }
  .sec-title{font-size:15px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .sec-title::before{content:"";width:8px;height:8px;background:#e65100;border:2px solid #4e342e}

  .era-row{display:flex;gap:10px}
  .era{
    flex:1;border:3px solid #4e342e;border-radius:16px;padding:10px 6px 8px;
    text-align:center;cursor:pointer;background:#fff;transition:transform .1s;
    box-shadow:0 4px 0 #4e342e;position:relative;
  }
  .era.ming{background:linear-gradient(#ffe3df,#fff)}
  .era.qing{background:linear-gradient(#dde9ff,#fff)}
  .era svg{width:84px;height:105px;margin:0 auto}
  .era .nm{font-weight:900;font-size:17px;margin-top:4px}
  .era .sub{font-size:11px;color:#6d4c41}
  .era.sel{transform:translateY(-3px)}
  .era.ming.sel{border-color:#c62828;box-shadow:0 0 0 3px #ffcdd2,0 6px 0 #c62828}
  .era.qing.sel{border-color:#1e4fa8;box-shadow:0 0 0 3px #bbdefb,0 6px 0 #1e4fa8}
  .era .chk{position:absolute;top:6px;right:8px;font-size:16px;display:none}
  .era.sel .chk{display:block}

  .inputs{display:flex;gap:8px;margin-top:16px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;font-weight:800;color:#5d4037}
  .field input{
    width:100%;padding:11px 10px;border:3px solid #4e342e;border-radius:12px;
    font-size:16px;font-weight:700;background:#fff;color:#3e2723;outline:none;
  }
  .field input:focus{border-color:#e65100;background:#fff8e1}
  .msg{min-height:18px;color:#c62828;font-size:12px;font-weight:800;margin-top:8px;text-align:center}

  .btn3d{
    display:block;width:100%;border:4px solid #4e342e;border-radius:16px;
    background:linear-gradient(180deg,#ffb74d 0%,#ff9800 45%,#f57c00 100%);
    color:#fff;font-size:21px;font-weight:900;padding:14px 0;cursor:pointer;
    text-shadow:0 2px 0 #8d3b00,0 0 2px #8d3b00;
    box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,0,0,.18),0 6px 0 #4e342e;
    margin-top:6px;transition:transform .06s, box-shadow .06s;font-family:inherit;
  }
  .btn3d:active{transform:translateY(5px);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,0,0,.18),0 1px 0 #4e342e}
  .btn3d.blue{background:linear-gradient(180deg,#64b5f6,#1e88e5 50%,#1565c0);text-shadow:0 2px 0 #0d3c78}
  .btn3d.small{font-size:17px;padding:11px 0}

  /* shelf */
  .shelf-wrap{margin-top:18px}
  .shelf-label{text-align:center;font-size:12px;font-weight:900;color:#fff;text-shadow:0 2px 0 #1d4f78;margin-bottom:6px}
  .shelf{
    background:#8d5a34;border:4px solid #4e342e;border-radius:12px;padding:8px 6px 0;
    box-shadow:0 5px 0 #2e1c16;
  }
  .shelf-items{display:flex;justify-content:space-between;align-items:flex-end}
  .shelf-item{width:13.5%;text-align:center}
  .shelf-item svg{width:100%;height:auto}
  .shelf-item span{display:block;font-size:9px;font-weight:800;color:#fff3e0;margin-top:2px;line-height:1.1;word-break:keep-all;min-height:20px}
  .plank{height:10px;background:#5d3a1e;margin:2px -6px 0;border-top:3px solid #4e342e;border-radius:0 0 8px 8px}

  /* ===== PLAY ===== */
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:#fff;font-weight:900;text-shadow:0 2px 0 #1d4f78;font-size:14px}
  .scorechip{background:#ffca28;color:#4e342e;border:3px solid #4e342e;border-radius:999px;padding:3px 12px;text-shadow:none;box-shadow:0 3px 0 #4e342e}
  .prog{height:16px;border:3px solid #4e342e;border-radius:999px;background:#fff;margin-top:8px;overflow:hidden}
  .prog i{display:block;height:100%;background:repeating-linear-gradient(90deg,#ff9800 0 10px,#ffb74d 10px 20px);transition:width .3s}
  .dots{display:flex;gap:4px;margin-top:8px;justify-content:center}
  .dots b{width:18px;height:8px;border:2px solid #4e342e;background:#fff;border-radius:2px}
  .dots b.ev{background:#e1bee7}
  .dots b.done{background:#66bb6a}
  .dots b.now{background:#ff9800}

  .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tag{font-size:12px;font-weight:900;padding:4px 10px;border:2px solid #4e342e;border-radius:999px;background:#fff}
  .tag.main{background:#ffe0b2}
  .tag.event{background:#f3e5f5;color:#6a1b9a}
  .tag.role{background:#e3f2fd;color:#0d47a1}
  .q-title{font-size:20px;font-weight:900;line-height:1.3;margin-bottom:10px;word-break:keep-all}
  .brief{background:#fff3e0;border:2px dashed #a1887f;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6;color:#5d4037;margin-bottom:12px;word-break:keep-all}
  .brief b{color:#e65100}
  .scene{font-size:15.5px;font-weight:700;line-height:1.65;margin-bottom:14px;word-break:keep-all}
  .choice{
    display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
    background:#fff;border:3px solid #4e342e;border-radius:14px;padding:12px;
    margin-bottom:10px;font-size:14.5px;line-height:1.55;font-weight:700;color:#3e2723;
    cursor:pointer;box-shadow:0 4px 0 #4e342e;font-family:inherit;word-break:keep-all;
    transition:transform .06s, box-shadow .06s;
  }
  .choice:active{transform:translateY(3px);box-shadow:0 1px 0 #4e342e;background:#fff8e1}
  .choice .lt{flex:none;width:28px;height:28px;border:3px solid #4e342e;border-radius:8px;background:#ffca28;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}

  /* ===== FEEDBACK ===== */
  .verdict{border:4px solid;border-radius:16px;padding:14px;margin-bottom:12px}
  .verdict.best{border-color:#2e7d32;background:#e8f5e9}
  .verdict.sub{border-color:#ef6c00;background:#fff3e0}
  .verdict h3{font-size:17px;font-weight:900;line-height:1.35;word-break:keep-all}
  .verdict.best h3{color:#1b5e20}
  .verdict.sub h3{color:#e65100}
  .verdict .gain{display:inline-block;margin-top:8px;font-weight:900;font-size:14px;padding:3px 10px;border-radius:999px;border:2px solid #4e342e;background:#fff}
  .verdict p{margin-top:10px;font-size:14.5px;line-height:1.65;word-break:keep-all}
  .picked{font-size:13px;background:#fff;border:2px solid #d7ccc8;border-radius:10px;padding:8px 10px;margin-bottom:12px;line-height:1.55;word-break:keep-all}
  .picked em{font-style:normal;font-weight:900;color:#6d4c41}
  .reason{background:#fdf6e3;border:3px solid #8d6e63;border-radius:14px;padding:12px;margin-bottom:14px}
  .reason h4{font-size:15px;font-weight:900;margin-bottom:6px;color:#4e342e}
  .reason p{font-size:14px;line-height:1.7;word-break:keep-all}
  .bestans{font-size:13px;line-height:1.55;background:#e8f5e9;border:2px solid #81c784;border-radius:10px;padding:8px 10px;margin-bottom:12px;word-break:keep-all}

  /* ===== RESULT ===== */
  .res-center{text-align:center}
  .medal{font-size:56px;line-height:1}
  .res-name{font-size:14px;font-weight:800;color:#6d4c41;margin-top:6px}
  .res-score{font-size:46px;font-weight:900;color:#e65100;margin-top:4px;text-shadow:0 3px 0 #4e342e22}
  .res-score small{font-size:18px;color:#8d6e63}
  .res-title{display:inline-block;margin-top:8px;font-size:20px;font-weight:900;padding:6px 16px;background:#ffca28;border:3px solid #4e342e;border-radius:12px;box-shadow:0 4px 0 #4e342e}
  .res-desc{font-size:13.5px;line-height:1.6;margin-top:12px;color:#5d4037;word-break:keep-all}
  .stats{display:flex;gap:8px;margin-top:14px}
  .stat{flex:1;border:3px solid #4e342e;border-radius:12px;background:#fff;padding:8px 4px;text-align:center}
  .stat b{display:block;font-size:20px;font-weight:900}
  .stat span{font-size:11px;font-weight:800;color:#6d4c41}
  .log{margin-top:14px;border-top:2px dashed #bcaaa4;padding-top:10px}
  .log-row{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid #efebe9;font-weight:700}
  .log-row .t{flex:1;word-break:keep-all}
  .log-row .s{flex:none;font-weight:900}
  .log-row .s.b{color:#2e7d32}.log-row .s.n{color:#ef6c00}
  .rank{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
  .rank th{background:#4e342e;color:#fff;padding:6px 4px;font-weight:800}
  .rank td{border-bottom:1px solid #d7ccc8;padding:6px 4px;text-align:center;font-weight:700}
  .rank tr.me td{background:#fff3c4}
  /* ===== ERA THEME ===== */
  body{--ac:#ff9800;--ac2:#f57c00;--ac-dk:#8d3b00;--ac-lt:#fff3e0;--ac-bar1:#ff9800;--ac-bar2:#ffb74d}
  body.era-ming{--ac:#e53935;--ac2:#b71c1c;--ac-dk:#5d1010;--ac-lt:#ffebee;--ac-bar1:#e53935;--ac-bar2:#ff8a80}
  body.era-qing{--ac:#1e88e5;--ac2:#0d47a1;--ac-dk:#0a2f66;--ac-lt:#e3f2fd;--ac-bar1:#1e88e5;--ac-bar2:#90caf9}
  body.era-ming .hero{border-bottom-color:#b71c1c}
  body.era-qing .hero{border-bottom-color:#0d47a1}
  .prog i{background:repeating-linear-gradient(90deg,var(--ac-bar1) 0 10px,var(--ac-bar2) 10px 20px)}
  .dots b.now{background:var(--ac)}
  .btn3d.theme{background:linear-gradient(180deg,var(--ac-bar2),var(--ac) 50%,var(--ac2));text-shadow:0 2px 0 var(--ac-dk)}
  .choice .lt{background:var(--ac);color:#fff}
  .choice:active{background:var(--ac-lt)}
  .brief{background:var(--ac-lt)}
  .brief b{color:var(--ac2)}
  .sec-title::before{background:var(--ac)}
  .card.themed{border-top-width:10px}
  body.era-ming .card.themed{border-top-color:#c62828}
  body.era-qing .card.themed{border-top-color:#1e4fa8}
  .avatar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .avatar{flex:none;width:52px;height:60px;border:3px solid #4e342e;border-radius:12px;background:var(--ac-lt);padding:3px 4px 0;overflow:hidden}
  .avatar svg{width:100%;height:auto}
  .avatar-row .tag-row{margin-bottom:0}
  .res-avatar{width:90px;margin:0 auto 4px;border:4px solid #4e342e;border-radius:16px;background:var(--ac-lt);padding:6px 8px 0;overflow:hidden}
  .res-avatar svg{width:100%;height:auto}

  /* ===== TEAM BATTLE ===== */
  .vs{display:flex;align-items:stretch;gap:6px;margin-top:4px}
  .team{flex:1;border:3px solid #4e342e;border-radius:14px;padding:8px 4px;text-align:center;color:#fff;position:relative}
  .team.ming{background:linear-gradient(#ef5350,#c62828)}
  .team.qing{background:linear-gradient(#42a5f5,#1e4fa8)}
  .team .tn{font-size:13px;font-weight:900;text-shadow:0 1px 0 #0005}
  .team .avg{font-size:28px;font-weight:900;line-height:1.1;text-shadow:0 2px 0 #0006}
  .team .cnt{font-size:11px;font-weight:800;opacity:.95}
  .team .crown{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:20px}
  .team.lead{box-shadow:0 0 0 3px #ffd54f}
  .vs-mid{align-self:center;font-weight:900;font-size:18px;color:#4e342e}
  .vs-bar{display:flex;height:14px;border:3px solid #4e342e;border-radius:999px;overflow:hidden;margin-top:10px;background:#eee}
  .vs-bar i{display:block;height:100%}
  .vs-note{font-size:12px;text-align:center;margin-top:8px;font-weight:800;color:#5d4037;word-break:keep-all}
  .mini-vs{margin-top:12px;font-size:12px;font-weight:800;text-align:center;background:#fff;border:2px dashed #bcaaa4;border-radius:10px;padding:6px;color:#5d4037}
  .mini-vs .r{color:#c62828}.mini-vs .b{color:#1e4fa8}
  .reset{display:block;margin:12px auto 0;background:none;border:none;color:#8d6e63;font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit}
  .hud{margin-top:10px;background:#fffaf0;border:3px solid #4e342e;border-radius:14px;padding:6px 10px;box-shadow:0 4px 0 #2e1c16}
  body.era-ming .hud{border-left:8px solid #c62828}
  body.era-qing .hud{border-left:8px solid #1e4fa8}
  .hud-row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0;font-size:13px;font-weight:800;border-bottom:1px dashed #d7ccc8}
  .hud-row:last-child{border-bottom:none}
  .hud-k{color:#6d4c41;flex:none}
  .hud-v{text-align:right;color:#3e2723}
  .hud-v b{font-weight:900}.hud-v b.big{font-size:17px;color:var(--ac2)}
  .hud-v small{font-size:11px;color:#8d6e63}
  .hud .up,.hud .down{display:inline-block}
  .hud .up{color:#2e7d32;font-weight:900;animation:pop .4s}
  .hud .down{color:#c62828;font-weight:900;animation:pop .4s}
  .hud .same{color:#9e9e9e;font-weight:900}
  .hud .win{background:#e8f5e9;color:#2e7d32;padding:1px 8px;border-radius:999px;border:2px solid #81c784}
  .hud .lose{background:#ffebee;color:#c62828;padding:1px 8px;border-radius:999px;border:2px solid #ef9a9a}
  @keyframes pop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
  .net{position:fixed;top:8px;right:8px;z-index:90;font-size:11px;font-weight:900;padding:4px 10px;border-radius:999px;border:2px solid #4e342e;background:#fff;box-shadow:0 2px 0 #4e342e}
  .net.on{background:#e8f5e9;color:#1b5e20}
  .net.off{background:#fff3e0;color:#e65100}
  .hud.noanim .up,.hud.noanim .down{animation:none}
  .m-pw{width:100%;margin-top:12px;padding:11px;border:3px solid #4e342e;border-radius:12px;font-size:16px;font-weight:800;text-align:center;font-family:inherit}
  .m-err{min-height:16px;color:#c62828;font-size:12px;font-weight:800;margin-top:6px}
  .live-dot{font-size:10px;background:#e53935;color:#fff;border-radius:6px;padding:1px 6px;margin-left:4px;animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.35}}
  .modal-ov{position:fixed;inset:0;background:rgba(30,20,15,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal{width:100%;max-width:320px;background:#fffaf0;border:4px solid #4e342e;border-radius:22px;box-shadow:0 6px 0 #2e1c16;padding:18px 16px;text-align:center;animation:fd .2s ease-out}
  .modal h3{font-size:18px;font-weight:900;margin-top:4px}
  .modal p{font-size:13.5px;line-height:1.6;margin-top:8px;color:#5d4037}
  .modal p b{color:#c62828}
  .modal-btns{display:flex;gap:8px;margin-top:16px}
  .modal-btns button{flex:1;padding:12px 0;border:3px solid #4e342e;border-radius:12px;font-size:16px;font-weight:900;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #4e342e}
  .modal-btns button:active{transform:translateY(3px);box-shadow:0 1px 0 #4e342e}
  .m-cancel{background:#fff;color:#4e342e}
  .m-ok{background:#e53935;color:#fff}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2e7d32;color:#fff;font-weight:900;font-size:14px;padding:10px 18px;border:3px solid #1b5e20;border-radius:999px;z-index:101;box-shadow:0 4px 12px rgba(0,0,0,.3);white-space:nowrap}
  .fade{animation:fd .25s ease-out}
  @keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ===== 터치 화면 최적화 ===== */
  button,.era,.choice{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  .choice{min-height:60px}
  .btn3d{min-height:56px}
  .reset{padding:10px 14px}
  .modal-btns button{min-height:52px}

  /* ===== 공통 보조 ===== */
  .wide-only{display:none}
  kbd{display:inline-block;min-width:20px;padding:1px 6px;margin:0 2px;border:2px solid #4e342e;border-bottom-width:3px;border-radius:6px;background:#fff;font-family:inherit;font-size:11px;font-weight:900;color:#4e342e;line-height:1.4}
  .kbd-hint{margin-top:10px;font-size:12px;font-weight:800;color:#6d4c41;text-align:center}
  .kbd-inline{margin-left:10px;font-size:12px;padding:2px 8px;border:2px solid rgba(255,255,255,.8);border-radius:6px;vertical-align:middle;text-shadow:none}
  .choice .key{margin-left:auto;flex:none;align-self:center;font-size:12px;font-weight:900;color:#8d6e63;border:2px solid #d7ccc8;border-radius:6px;padding:1px 7px}
  .choice.pressed{transform:translateY(3px);box-shadow:0 1px 0 #4e342e;background:var(--ac-lt)}
  .howto ol{padding-left:20px;font-size:14px;line-height:1.75;color:#4e342e}
  .howto ol b{color:var(--ac2)}
  button:focus-visible,input:focus-visible,.era:focus-visible{outline:3px solid #ffca28;outline-offset:2px}
  @media (hover:hover) and (pointer:fine){
    .choice:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 6px 0 #4e342e}
    .era:hover{transform:translateY(-3px)}
    .btn3d:hover{filter:brightness(1.06)}
  }

  /* ===== 크롬북·노트북·가로 태블릿 (넓은 화면) ===== */
  @media (min-width: 900px){
    #wrap{max-width:1180px;padding:0 24px 32px}
    .hero{margin:0 -24px;background:linear-gradient(to bottom,#4a97d6 0 16%,#5aa9e6 16% 32%,#6fb8ee 32% 52%,#8ccaf4 52% 55%,#7fb3a0 55% 58%,#b08a5a 58% 68%,#8a6a40 68% 69.5%,#6aa84f 69.5% 100%)}
    .hero svg{width:auto;height:250px;margin:0 auto}
    .title-zone{margin-top:-78px}
    .title3d{font-size:50px;letter-spacing:-1.5px}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function buildSteps(){
  const events = shuffle(SURPRISE_EVENTS).slice(0,4);
  // 7 gaps between 8 main rounds (after round 1..7); pick 4 distinct gaps
  const gaps = shuffle([1,2,3,4,5,6,7]).slice(0,4).sort((a,b)=>a-b);
  const steps=[]; let e=0;
  MAIN_ROUNDS.forEach((r,i)=>{
    steps.push({type:"main",data:r});
    if(e<gaps.length && gaps[e]===i+1){steps.push({type:"event",data:events[e]});e++;}
  });
  return steps;
}

function teamStats(list){
  const t={명:{n:0,sum:0,best:0},청:{n:0,sum:0,best:0}};
  list.forEach(r=>{const x=t[r.era];if(!x)return;x.n++;x.sum+=r.score;x.best=Math.max(x.best,r.score)});
  ["명","청"].forEach(k=>{t[k].avg=t[k].n?Math.round(t[k].sum/t[k].n*10)/10:0});
  return t;
}

const GAS_NATIVE = !!(typeof google!=="undefined" && google.script && google.script.run);
const API = String(API_URL||"").trim();
const ONLINE = GAS_NATIVE || /^https:\/\/script\.google(usercontent)?\.com\//.test(API);
const POLL_MS = 6000;
let REMOTE = { records:[], live:[] };
let SCREEN = "start";
let SID = "";
let pollTimer = null, polling = false, netOk = null;

function withTimeout(p, ms){
  return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]);
}
function gas(fn, arg){
  if(GAS_NATIVE){
    return new Promise((res,rej)=>{
      try{ google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](arg); }
      catch(e){ rej(e); }
    });
  }
  // 깃허브 등 외부 호스팅: 앱스크립트 웹앱을 fetch로 호출
  // (text/plain 으로 보내면 브라우저 사전 요청(CORS preflight) 없이 동작)
  const req = fn==="getState"
    ? fetch(API+(API.indexOf("?")<0?"?":"&")+"action=getState&_="+Date.now(), {cache:"no-store", redirect:"follow"})
    : fetch(API, {method:"POST", redirect:"follow", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action:fn, arg:arg})});
  return withTimeout(req, 15000)
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(d=>{ if(d && d.error) throw new Error(d.error); return d; });
}
function applyState(st){
  if(st && Array.isArray(st.records)){
    REMOTE.records = st.records;
    REMOTE.live = Array.isArray(st.live) ? st.live : [];
    // 아직 서버에 반영되지 않은 내 결과는 화면에서 유지
    if(S.lastRec && S.pendingSave && !REMOTE.records.some(r=>r.t===S.lastRec.t && r.sid===S.lastRec.sid)){
      REMOTE.records.push(S.lastRec);
    }
    setNet(true);
  }
}
function setNet(ok){
  netOk = ok;
  const el=document.getElementById("net");
  if(el){ el.className="net "+(ok?"on":"off"); el.textContent = ok ? "🟢 실시간 연결됨" : "🟠 연결 재시도 중…"; }
}
function refresh(){
  if(!ONLINE || polling) return;
  polling = true;
  gas("getState").then(st=>{ applyState(st); updateLive(true); })
    .catch(()=>setNet(false))
    .then(()=>{ polling=false; });
}
function startPolling(){
  if(!ONLINE || pollTimer) return;
  pollTimer = setInterval(()=>{ if(!document.hidden) refresh(); }, POLL_MS);
}
function liveOthers(){ return ONLINE ? REMOTE.live.filter(p=>p.sid!==SID) : []; }
function sendProgress(){
  if(!ONLINE) return;
  const done=S.log.length;
  gas("submitProgress",{ sid:SID, cls:S.cls, num:S.num, name:S.name, era:S.era, done:done, pct:done?S.pp[done-1]:0, score:S.score })
    .then(st=>{ applyState(st); updateLive(true); })
    .catch(()=>setNet(false));
}
function updateLive(isRefresh){
  if(SCREEN==="start"){
    const el=document.getElementById("miniVs");
    if(el){ el.innerHTML = miniVsHTML(); bindReset0(); }
  }else if(SCREEN==="play"){
    const el=document.getElementById("hud");
    if(el) el.outerHTML = liveHUD(isRefresh);

    renderResultBoards();
  }
}

        ${ICONS.map(i=>`<div class="shelf-item">${i.svg}<span>${i.name}</span></div>`).join("")}
      </div>
      <div class="plank"></div>
    </div>
  </div>
  </div>
  </div>`;

  app.querySelectorAll(".era").forEach(el=>{
    el.addEventListener("click",()=>{
      S.era = el.dataset.era;
      setTheme(S.era);
      app.querySelectorAll(".era").forEach(x=>x.classList.toggle("sel",x===el));
      document.getElementById("msg").textContent="";
    });
  });
  bindReset0();
  document.getElementById("btnStart").addEventListener("click",()=>{
    const cls=document.getElementById("inCls").value.trim();
    const num=document.getElementById("inNum").value.trim();
    const name=document.getElementById("inName").value.trim();
    const msg=document.getElementById("msg");
    if(!S.era){msg.textContent="⚠️ 명 또는 청 시대를 먼저 선택하세요!";return;}
    if(!cls||!num||!name){msg.textContent="⚠️ 학급, 번호, 닉네임을 모두 입력하세요!";return;}
    S.cls=cls;S.num=num;S.name=name;
    S.steps=buildSteps();S.idx=0;S.score=0;S.log=[];S.pp=[];S.rankHist=[];
    S.lastRec=null;S.pendingSave=false;
    SID="s"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    renderPlay();
    sendProgress();
  });
}

/* ======================= PLAY SCREEN ======================= */
/* ===== LIVE HUD: rank & team change after every decision ===== */
function othersPctAt(r,k){
  if(r.pp && r.pp[k-1]!=null) return r.pp[k-1];
  return r.score/MAX_SCORE;
}
function liveHUD(isRefresh){
  const done=S.log.length, others=loadRank(), live=liveOthers();
  const total=others.length+live.length+1;
  const ally = S.era==="명"?"명":"청", foe = ally==="명"?"청":"명";
  const tAll=teamStats(others), A=tAll[ally], F=tAll[foe];
  const liveRow = ONLINE ? `<div class="hud-row"><span class="hud-k">🎮 지금 플레이 중</span><span class="hud-v">명 ${live.filter(p=>p.era==="명").length+(ally==="명"?1:0)}명 · 청 ${live.filter(p=>p.era==="청").length+(ally==="청"?1:0)}명</span></div>` : "";
  const cls = "hud"+(isRefresh?" noanim":"");
  if(!done){
    return `<div class="${cls}" id="hud">
      <div class="hud-row"><span class="hud-k">📊 실시간 순위</span><span class="hud-v">첫 결정 후 공개 · 참가 ${total}명</span></div>
      <div class="hud-row"><span class="hud-k">${ally==="명"?"🔴":"🔵"} ${ally}팀 평균</span><span class="hud-v">${A.n?A.avg+"점 ("+A.n+"명)":"아직 기록 없음"}</span></div>
      ${liveRow}
    </div>`;
  }
  const my = S.pp[done-1];
  const rank = 1 + others.filter(r=>othersPctAt(r,done) > my + 1e-9).length
                 + live.filter(p=>p.done>0 && p.pct > my + 1e-9).length;
  S.rankHist[done]=rank;
  const prev = S.rankHist[done-1];
  let delta="";
  if(prev!=null){
    const dlt=prev-rank;
    delta = dlt>0?`<span class="up">▲${dlt}</span>`:dlt<0?`<span class="down">▼${-dlt}</span>`:`<span class="same">-</span>`;
  }
  const proj = Math.round(my*MAX_SCORE*10)/10;
  const teamNow = A.n ? Math.round((A.sum+proj)/(A.n+1)*10)/10 : proj;
  let teamChg="";
  if(A.n){
    const d=Math.round((teamNow-A.avg)*10)/10;
    teamChg = d>0?`<span class="up">▲${d}</span>`:d<0?`<span class="down">▼${-d}</span>`:`<span class="same">±0</span>`;
  }
  const lead = F.n ? (teamNow>F.avg?`<span class="win">${ally}팀 우세</span>`:teamNow<F.avg?`<span class="lose">${foe}팀 우세</span>`:`<span class="same">동점</span>`) : `<span class="same">${foe}팀 기록 없음</span>`;
  const medal = rank===1?"🥇":rank===2?"🥈":rank===3?"🥉":"";
  return `<div class="${cls}" id="hud">
    <div class="hud-row"><span class="hud-k">📊 실시간 순위</span>
      <span class="hud-v"><b class="big">${medal}${rank}위</b> / ${total}명 ${delta}</span></div>
    <div class="hud-row"><span class="hud-k">🎯 예상 최종 점수</span>
      <span class="hud-v"><b>${proj}</b>점 <small>(달성률 ${Math.round(my*100)}%)</small></span></div>
    <div class="hud-row"><span class="hud-k">${ally==="명"?"🔴":"🔵"} ${ally}팀 평균</span>
      <span class="hud-v">${A.n?`${A.avg} → <b>${teamNow}</b>점 ${teamChg}`:`<b>${teamNow}</b>점 <small>(첫 참가자)</small>`}</span></div>
    <div class="hud-row"><span class="hud-k">⚔️ vs ${foe}팀 ${F.n?F.avg+"점":""}</span><span class="hud-v">${lead}</span></div>
    ${liveRow}
  </div>`;
}

function headerHTML(){
  const done = S.idx;
  return `
  <div class="topbar">
    <span>${S.era==="명"?"🔴":"🔵"} ${esc(S.name)} · 단계 ${S.idx+1} / ${TOTAL_STEPS}</span>
    <span class="scorechip">⭐ ${S.score}점</span>
  </div>
  <div class="prog"><i style="width:${(done/TOTAL_STEPS)*100}%"></i></div>
  <div class="dots">${S.steps.map((s,i)=>`<b class="${s.type==="event"?"ev ":""}${i<S.idx?"done":i===S.idx?"now":""}"></b>`).join("")}</div>
  ${liveHUD(false)}`;
}

function renderPlay(){
  SCREEN="play";
  const step = S.steps[S.idx], d = step.data;
  S.order = shuffle([0,1,2]);
  const isEv = step.type==="event";
  document.body.classList.add("ingame");
  app.innerHTML = `<div class="play-grid"><aside class="side">${headerHTML()}</aside><main class="main">
  <div class="card themed fade">
    <div class="avatar-row">
      <div class="avatar">${eraSvg(S.era)}</div>
      <div class="tag-row">
        <span class="tag ${isEv?"event":"main"}">${isEv?"🎁 서프라이즈 이벤트":"🏯 본 라운드"}</span>
        <span class="tag role">👤 ${d.role}</span>
      </div>
    </div>
    <div class="q-title">${d.title}</div>
    <div class="brief"><b>📜 브리핑</b><br>${d.briefing}</div>
    <div class="scene">${d.scene}</div>
    ${S.order.map((ci,k)=>`
      <button class="choice" data-ci="${ci}"><span class="lt">${"ABC"[k]}</span><span>${d.choices[ci].text}</span></button>
    `).join("")}
  </div></main></div>`;
  let picked=false;
  app.querySelectorAll(".choice").forEach(b=>{
    b.addEventListener("click",()=>{ if(picked) return; picked=true; choose(parseInt(b.dataset.ci,10)); });
  });
  scrollTop();
}

function choose(ci){
  const step=S.steps[S.idx], d=step.data, c=d.choices[ci];
  S.score += c.score;
  const bestScore = Math.max(...d.choices.map(x=>x.score));
  S.log.push({title:d.title, score:c.score, best:c.isBest, type:step.type, max:bestScore});
  const maxSoFar = S.log.reduce((a,l)=>a+l.max,0);
  S.pp.push(Math.round(S.score/maxSoFar*10000)/10000);
  renderFeedback(d,c);
  sendProgress();
}

/* ======================= FEEDBACK ======================= */
function renderFeedback(d,c){
  SCREEN="play";
  const best = d.choices.find(x=>x.isBest);
  const last = S.idx===TOTAL_STEPS-1;
  document.body.classList.add("ingame");
  app.innerHTML = `<div class="play-grid"><aside class="side">${headerHTML()}</aside><main class="main">
  <div class="card themed fade">
    <div class="q-title" style="font-size:17px">${d.title}</div>
    <div class="picked"><em>나의 선택 ▸</em> ${c.text}</div>
    <div class="fb-grid"><div>
    <div class="verdict ${c.isBest?"best":"sub"}">
      <h3>${c.isBest?"🌟 [최선의 역사적 결정] 만점 획득!":"💡 [차선책 / 역사적 평가]"}</h3>
      <span class="gain">+${c.score}점 / ${best.score}점</span>
      <p>${c.critique}</p>
    </div>
    ${c.isBest?"":`<div class="bestans">✅ <b>최선의 결정은?</b><br>${best.text}</div>`}
    </div><div>
    <div class="reason">
      <h4>📖 역사 배경 및 핵심 해설</h4>
      <p>${c.reason}</p>
    </div>
    </div></div>
    <button class="btn3d ${last?"":"theme"} small" id="btnNext">${last?"최종 결과 보기 🏆":"다음 단계 ▶"}</button>
  </div></main></div>`;
  document.getElementById("btnNext").addEventListener("click",()=>{
    S.idx++;
    if(S.idx>=TOTAL_STEPS) renderResult(); else renderPlay();
  },{once:true});
  scrollTop();
}

/* ======================= RESULT ======================= */
function getTitle(score){
  const r = score/MAX_SCORE;
  if(score===MAX_SCORE) return {m:"👑",t:"전설의 명군 · 최고 전략가",d:"12단계 모두 최선의 역사적 결정을 내렸습니다! 경제·외교·문화 전 분야를 꿰뚫는 완벽한 왕조 경영자입니다."};
  if(r>=0.95) return {m:"🏆",t:"최고 전략가",d:"거의 모든 위기에서 최선의 판단을 내렸습니다. 명·청 시대의 흐름을 정확히 이해하고 있는 뛰어난 전략가입니다."};
  if(r>=0.90) return {m:"🎖️",t:"외교 통치 전문가",d:"대외 관계와 국내 통치의 균형을 잘 잡았습니다. 몇 가지 결정만 더 다듬으면 최고 전략가가 될 수 있습니다!"};
  if(r>=0.85) return {m:"📜",t:"유능한 재상",d:"왕조를 안정적으로 이끌었습니다. 해설을 다시 읽으며 차선책을 고른 이유를 되짚어 보세요."};
  return {m:"🌱",t:"성장하는 견습 관리",d:"아직 배울 것이 많지만 가능성은 충분합니다! 역사 배경 해설을 복습하고 다시 도전해 보세요."};
}

/* in-page confirm (window.confirm is blocked in some tablet/app viewers) */
function askReset(after){
  const ov=document.createElement("div");
  ov.className="modal-ov";
  ov.innerHTML=`<div class="modal">
    <div style="font-size:34px">🗑️</div>
    <h3>기록을 초기화할까요?</h3>
    <p>${ONLINE?"구글 시트에 저장된 <b>모든 학생의</b>":"이 기기에 저장된 모든"} 랭킹과<br>팀 대항전 기록이 지워집니다.<br><b>되돌릴 수 없습니다.</b></p>
    ${ONLINE?'<input class="m-pw" type="password" inputmode="numeric" placeholder="선생님 비밀번호" autocomplete="off"><div class="m-err"></div>':""}
    <div class="modal-btns">
      <button class="m-cancel">취소</button>
      <button class="m-ok">초기화</button>
    </div></div>`;
  document.body.appendChild(ov);
  const close=()=>{ if(ov.parentNode) ov.parentNode.removeChild(ov); };
  const done=()=>{ close(); after && after(); toast("✅ 기록이 초기화되었습니다"); };
  ov.querySelector(".m-cancel").addEventListener("click",close);
  ov.addEventListener("click",e=>{ if(e.target===ov) close(); });
  const ok=ov.querySelector(".m-ok");
  ok.addEventListener("click",()=>{
    if(!ONLINE){ saveRank([]); done(); return; }
    const pw=ov.querySelector(".m-pw").value, err=ov.querySelector(".m-err");
    if(!pw){ err.textContent="비밀번호를 입력하세요."; return; }
    ok.disabled=true; ok.textContent="처리 중…";
    gas("resetAll",pw).then(r=>{
      if(r && r.ok){ applyState(r.state); done(); }
      else { err.textContent="비밀번호가 틀렸습니다."; ok.disabled=false; ok.textContent="초기화"; }
    }).catch(()=>{ err.textContent="연결 오류입니다. 잠시 후 다시 시도하세요."; ok.disabled=false; ok.textContent="초기화"; });
  });
}
function toast(msg){
  const t=document.createElement("div");t.className="toast";t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>{ if(t.parentNode) t.parentNode.removeChild(t); },1800);
}

function submitResult(rec, tries){
  gas("submitResult",rec).then(st=>{
    S.pendingSave=false; applyState(st); updateLive(true);
  }).catch(()=>{
    setNet(false);
    if(tries>1) setTimeout(()=>submitResult(rec,tries-1),3000);
    else toast("⚠️ 결과 저장에 실패했습니다. 인터넷 연결을 확인하세요.");
  });
}

function renderResult(){
  SCREEN="result";
  const T = getTitle(S.score);
  const bestCnt = S.log.filter(l=>l.best).length;
  const rec = {sid:SID,cls:S.cls,num:S.num,name:S.name,era:S.era,score:S.score,t:Date.now(),pp:S.pp.slice()};
  S.lastRec = rec;
  if(ONLINE){
    S.pendingSave = true;
    REMOTE.records.push(rec);
    REMOTE.live = REMOTE.live.filter(p=>p.sid!==SID);
    submitResult(rec, 4);
  }else{
    let rank = loadRank();
    rank.push(rec);
    rank.sort((a,b)=>b.score-a.score || a.t-b.t);
    saveRank(rank.slice(0,500));
  }

  document.body.classList.add("ingame");
  app.innerHTML = `
  <div class="result-grid"><div>
  <div class="card themed fade res-center">
    <div class="res-avatar">${eraSvg(S.era)}</div>
    <div class="medal" style="font-size:40px">${T.m}</div>
    <div class="res-name">${esc(S.cls)}반 · ${esc(S.name)} · ${S.era}팀</div>
    <div class="res-score">${S.score}<small> / ${MAX_SCORE}점</small></div>
    <div class="res-title">${T.t}</div>
    <p class="res-desc">${T.d}</p>
    <div class="stats">
      <div class="stat"><b style="color:#2e7d32">${bestCnt}</b><span>최선의 결정</span></div>
      <div class="stat"><b style="color:#ef6c00">${TOTAL_STEPS-bestCnt}</b><span>차선책</span></div>
      <div class="stat"><b>${Math.round(S.score/MAX_SCORE*100)}%</b><span>달성률</span></div>
    </div>
    <div class="log" style="text-align:left">
      <div class="sec-title">단계별 기록</div>
      ${S.log.map((l,i)=>`<div class="log-row"><span class="t">${i+1}. ${l.title}</span><span class="s ${l.best?"b":"n"}">${l.best?"🌟":"💡"} +${l.score}</span></div>`).join("")}
    </div>
  </div>
  </div><div>
  <div id="boards"></div>
  <div class="card fade">
    <button class="btn3d theme" id="btnAgain">다시 도전하기 ↻</button>
    <button class="reset" id="btnReset">🗑️ 기록 초기화 (선생님용)</button>
  </div>
  </div></div>`;
  renderResultBoards();
  document.getElementById("btnAgain").addEventListener("click",()=>{renderStart();scrollTop();});
  document.getElementById("btnReset").addEventListener("click",()=>{
    askReset(()=>{renderStart();scrollTop();});
  });
  scrollTop();
}

function renderResultBoards(){
  const box=document.getElementById("boards");
  if(!box || !S.lastRec) return;
  const me=S.lastRec;
  const isMe=r=>r.t===me.t && (r.sid===me.sid || (!r.sid && r.name===me.name));
  let rank = loadRank();
  if(!rank.some(isMe)) rank.push(me);       // 초기화 직후 등에도 내 점수는 표시
  rank.sort((a,b)=>b.score-a.score || a.t-b.t);
  const top = rank.slice(0,10);
  const myPos = rank.findIndex(isMe)+1;
  const before = teamStats(rank.filter(r=>!isMe(r)))[me.era];
  const after = teamStats(rank)[me.era];
  const diff = Math.round((me.score-before.avg)*10)/10;
  const contrib = !before.n ? `${me.era}팀의 첫 번째 참가자예요! 팀 평균 ${after.avg}점으로 출발합니다.`
                : diff>0 ? `내 점수로 ${me.era}팀 평균이 ${before.avg} → ${after.avg}점으로 올랐어요! 🎉`
                : diff<0 ? `${me.era}팀 평균이 ${before.avg} → ${after.avg}점이 되었어요. 다시 도전해 팀 평균을 올려 보세요!`
                : `${me.era}팀 평균과 같은 점수예요! (${after.avg}점)`;
  const live=liveOthers();
  box.innerHTML = `
  <div class="card">
    <div class="sec-title">⚔️ 명팀 vs 청팀 대항전${ONLINE?' <span class="live-dot">LIVE</span>':""}</div>
    ${vsHTML(rank)}
    <div class="vs-note" style="color:${me.era==="명"?"#c62828":"#1e4fa8"}">${contrib}</div>
    ${ONLINE?`<div class="vs-note">🎮 지금 플레이 중 · 명 ${live.filter(p=>p.era==="명").length}명 · 청 ${live.filter(p=>p.era==="청").length}명</div>`:""}
  </div>
  <div class="card">
    <div class="sec-title">🏆 ${ONLINE?"실시간 전체 랭킹":"이 기기 랭킹"} TOP 10</div>
    <table class="rank">
      <tr><th>순위</th><th>학급</th><th>닉네임</th><th>팀</th><th>점수</th></tr>
      ${top.map((r,i)=>`<tr class="${isMe(r)?"me":""}"><td>${i<3?["🥇","🥈","🥉"][i]:i+1}</td><td>${esc(r.cls)}</td><td>${esc(r.name)}</td><td style="color:${r.era==="명"?"#c62828":"#1e4fa8"};font-weight:900">${esc(r.era)}</td><td><b>${r.score}</b></td></tr>`).join("")}
    </table>
    ${myPos>10?`<div class="vs-note">내 순위: <b>${myPos}위</b> / ${rank.length}명</div>`:""}
  </div>`;
}

/* ======================= INIT ======================= */
(function init(){
  if(ONLINE){
    const b=document.createElement("div"); b.id="net"; b.className="net"; b.textContent="⏳ 연결 중…";
    document.body.appendChild(b);
    renderStart();
    gas("getState").then(st=>{ applyState(st); updateLive(true); }).catch(()=>setNet(false));
    startPolling();
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh(); });
  }else{
    renderStart();
  }
})();
</script>
</body>
</html>
